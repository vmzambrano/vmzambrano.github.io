<head>
  <meta charset="UTF-8" />

  <!-- Google Fonts + Font Awesome + jQuery + reproductor -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://victormusicperu.github.io/js/lunaradio-animado.js"></script>

  <style>
    /* ----- RESET & BASE ----- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      font-family: 'Inter', sans-serif;
      background: #0b0f18;
      color: #f0f0f0;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    /* ----- HEADER / MENÚ LATERAL ----- */
    #header {
      position: fixed;
      top: 0;
      left: -300px;
      width: 280px;
      height: 100vh;
      background: rgba(15, 20, 30, 0.96);
      backdrop-filter: blur(8px);
      border-right: 1px solid rgba(255, 255, 255, 0.08);
      padding: 30px 18px 40px 18px;
      transition: left 0.35s cubic-bezier(0.22, 1, 0.36, 1);
      z-index: 1000;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      box-shadow: 4px 0 30px rgba(0, 0, 0, 0.6);
    }

    #header::-webkit-scrollbar {
      width: 4px;
    }
    #header::-webkit-scrollbar-track {
      background: transparent;
    }
    #header::-webkit-scrollbar-thumb {
      background: #005cff;
      border-radius: 8px;
    }

    .nav-menu ul {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 20px;
    }

    .nav-menu a {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 18px;
      border-radius: 60px;
      font-size: 15px;
      font-weight: 500;
      color: #cfd8e6;
      background: rgba(255, 255, 255, 0.04);
      transition: all 0.25s ease;
      border: 1px solid transparent;
    }

    .nav-menu a i {
      width: 22px;
      font-size: 18px;
      text-align: center;
      color: #005cff;
      transition: transform 0.2s;
    }

    .nav-menu a span {
      flex: 1;
    }

    .nav-menu a:hover {
      background: #005cff;
      color: #fff;
      border-color: #005cff;
      transform: scale(1.02);
      box-shadow: 0 8px 20px rgba(0, 92, 255, 0.3);
    }

    .nav-menu a:hover i {
      color: #fff;
      transform: scale(1.1);
    }

    /* ----- BOTÓN HAMBURGUESA ----- */
    .mobile-nav-toggle {
      position: fixed;
      top: 18px;
      right: 20px;
      z-index: 1100;
      background: rgba(0, 92, 255, 0.9);
      border: none;
      border-radius: 60px;
      width: 50px;
      height: 50px;
      font-size: 24px;
      color: #fff;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 8px 24px rgba(0, 92, 255, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .mobile-nav-toggle:hover {
      background: #005cff;
      transform: scale(1.05);
      box-shadow: 0 10px 30px rgba(0, 92, 255, 0.6);
    }

    .mobile-nav-active #header {
      left: 0;
    }

    .mobile-nav-active .mobile-nav-toggle {
      right: 20px;
      background: #1a1f2b;
    }

    /* ----- RELOJ FLOTANTE ----- */
    .background_hora {
      position: fixed;
      top: 20px;
      left: 20px;
      background: rgba(10, 14, 24, 0.85);
      backdrop-filter: blur(12px);
      padding: 0 24px;
      height: 52px;
      border-radius: 60px;
      display: flex;
      align-items: center;
      gap: 14px;
      font-family: 'Inter', sans-serif;
      font-size: 20px;
      font-weight: 600;
      color: #fff;
      z-index: 900;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.08);
      letter-spacing: 0.5px;
    }

    .background_hora i {
      color: #005cff;
      font-size: 20px;
    }

    .background_hora #relogio {
      min-width: 80px;
      font-variant-numeric: tabular-nums;
    }

    /* ----- BOTONERA SOCIAL (flotante derecha) ----- */
    .social-bar {
      position: fixed;
      top: 50%;
      right: 16px;
      transform: translateY(-50%);
      z-index: 900;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: rgba(10, 14, 24, 0.6);
      backdrop-filter: blur(8px);
      padding: 14px 10px;
      border-radius: 40px;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .social-bar a {
      display: block;
      transition: transform 0.2s ease, filter 0.2s;
      border-radius: 50%;
      line-height: 0;
    }

    .social-bar a:hover {
      transform: scale(1.15);
      filter: brightness(1.3);
    }

    .social-bar img {
      width: 32px;
      height: 32px;
      display: block;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.05);
      padding: 2px;
    }

    /* ----- REPRODUCTOR (contenedor) ----- */
    #player {
      flex: 1;
      width: 100%;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 30% 40%, #141b2b, #070a12);
    }

    /* Ajustes internos del reproductor (lunaradio) */
    .lunaradio {
      --lr-bg: rgba(9, 15, 25, 0.75) !important;
      backdrop-filter: blur(4px);
      border-radius: 32px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7);
      max-width: 560px;
      margin: 20px;
    }

    .lunaradio .coverimage {
      animation: spin 12s linear infinite;
      border-radius: 50%;
      box-shadow: 0 0 0 4px rgba(0, 92, 255, 0.2), 0 0 40px rgba(0, 92, 255, 0.15);
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* ----- RESPONSIVE ----- */
    @media (min-width: 992px) {
      .mobile-nav-toggle {
        display: flex;
      }
      #header {
        left: -300px;
      }
    }

    @media (max-width: 768px) {
      .background_hora {
        top: 20px;
        left: 20px;
        bottom: auto;
        transform: none;
        height: 44px;
        font-size: 16px;
        padding: 0 16px;
        gap: 10px;
        background: rgba(10, 14, 24, 0.85);
        border: 1px solid rgba(255, 255, 255, 0.06);
      }

      .background_hora i {
        font-size: 16px;
      }

      .background_hora #relogio {
        min-width: 70px;
        font-size: 15px;
      }

      .social-bar {
        right: 8px;
        padding: 10px 6px;
        gap: 10px;
        background: rgba(10, 14, 24, 0.7);
      }

      .social-bar img {
        width: 26px;
        height: 26px;
      }

      #header {
        width: 260px;
        left: -280px;
        padding: 20px 14px 30px 14px;
      }

      .nav-menu a {
        font-size: 14px;
        padding: 10px 14px;
      }

      .lunaradio {
        max-width: 94%;
        margin: 10px;
        border-radius: 24px;
      }
    }

    @media (max-width: 480px) {
      .background_hora {
        top: 14px;
        left: 14px;
        height: 40px;
        font-size: 14px;
        padding: 0 14px;
        gap: 8px;
        border-radius: 40px;
      }
      .background_hora i {
        font-size: 14px;
      }
      .background_hora #relogio {
        min-width: 60px;
        font-size: 13px;
      }
      .mobile-nav-toggle {
        width: 44px;
        height: 44px;
        font-size: 20px;
        top: 14px;
        right: 14px;
      }
    }

    @media (max-width: 380px) {
      .background_hora {
        top: 10px;
        left: 10px;
        height: 36px;
        font-size: 12px;
        padding: 0 10px;
        gap: 6px;
      }
      .background_hora i {
        font-size: 12px;
      }
      .background_hora #relogio {
        min-width: 55px;
        font-size: 12px;
      }
      .mobile-nav-toggle {
        width: 38px;
        height: 38px;
        font-size: 18px;
        top: 10px;
        right: 10px;
      }
    }
  </style>

  <!-- Bloqueo de clic derecho y teclas -->
  <script>
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('keydown', function(e) {
      const blocked = ['F12', 'I', 'J', 'C', 'U', 'S', 'K'];
      if (
        e.key === 'F12' ||
        (e.ctrlKey && e.shiftKey && blocked.includes(e.key.toUpperCase())) ||
        (e.ctrlKey && ['U', 'S'].includes(e.key.toUpperCase()))
      ) {
        e.preventDefault();
        return false;
      }
    });
  </script>

    // Toggle menú móvil

    // Cerrar menú al hacer clic en un enlace (móvil)
    document.querySelectorAll('.nav-menu a').forEach(link => {
